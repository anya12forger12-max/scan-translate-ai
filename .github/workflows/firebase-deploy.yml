name: Firebase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  security-rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Firebase Emulator)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firebase/rules-testing/package-lock.json

      - name: Install rules-testing dependencies
        working-directory: firebase/rules-testing
        run: npm ci

      - name: Run Firestore/Storage security-rules suite (Firebase Emulator)
        working-directory: firebase/rules-testing
        run: npm test

  deploy-rules:
    runs-on: ubuntu-latest
    needs: security-rules-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        # Keep the CLI in lockstep with the emulator/rules-test suite so a
        # CLI major bump cannot break deploy independently of the tests.
        run: npm install -g firebase-tools@15.31.0

      - name: Deploy Firestore Rules and Indexes
        # firestore.indexes.json declares the composite indexes the History
        # screen's queries need. Deploying rules alone leaves production with
        # missing indexes (runtime "The query requires an index" failures).
        # Storage is intentionally excluded: the project has no bucket.
        run: firebase deploy --only firestore:rules,firestore:indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
