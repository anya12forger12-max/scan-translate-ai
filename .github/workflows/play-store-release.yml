name: Play Store Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" > android/app/google-services.json
            echo "Wrote google-services.json from secret."
          else
            echo "GOOGLE_SERVICES_JSON secret not set; using committed google-services.json."
          fi

      - name: Build Android Release Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-number=${{ github.run_number }}

      - name: Build Android Release APK
        run: |
          flutter build apk \
            --release \
            --build-number=${{ github.run_number }}

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      # Play upload needs a Play service account secret AND an upload key that
      # matches the Play Console app. CI has no keystore, so the AAB is
      # debug-signed and this step may legitimately fail — the Android
      # artifacts above are the reliable deliverable. Never fail the build.
      - name: Upload to Google Play
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.scantranslateai.scan_translate_ai
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode GoogleService-Info.plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST" ]; then
            echo "$PLIST" > ios/Runner/GoogleService-Info.plist
            echo "Wrote GoogleService-Info.plist from secret."
          else
            echo "GOOGLE_SERVICE_INFO_PLIST secret not set; using committed plist (if any)."
          fi

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-number=${{ github.run_number }}

      - name: Upload to TestFlight
        continue-on-error: true
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: 'build/ios/iphoneos/Runner.app'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}