analyzer:
  errors:
    # Flutter 3.50 marks package:flutter/material.dart as deprecated in favour
    # of package:material_ui. Ignore that advisory until the migration lands so
    # the analyzer result is stable across SDK versions.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # firebase/rules-testing is a Node.js project; its firebase-tools
    # dependency ships Dart templates that are not part of this app.
    - firebase/**
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    avoid_print: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true
    avoid_unnecessary_containers: true
    prefer_const_literals_to_create_immutables: true
