name: scan_translate_ai
description: 'Scan & Translate AI - Premium QR/Barcode Scanner, OCR, and Translation App'
publish_to: 'none'
version: 1.2.28+33

environment:
  sdk: ^3.12.2

dependencies:
  # Unused deps removed in a dependency sweep. All verified as zero-import
  # across lib/ and test/. firebase_storage / firebase_analytics /
  # firebase_messaging are uninitialised SDKs (the app uses Auth + Firestore
  # only). camera is unused because scanning goes through mobile_scanner,
  # which pulls camera transitively anyway. http is unused (cloud_firestore
  # covers networking); qr_flutter is unused (mobile_scanner renders the QR
  # preview); flutter_secure_storage and flutter_local_notifications were
  # never wired up. Analytics stays wired at the native layer via
  # firebase-analytics-ktx in android/app/build.gradle.kts, which is
  # unaffected by removing the unused Dart wrapper.
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_crashlytics: ^4.3.4

  # Authentication
  google_sign_in: ^6.3.0

  # ML Kit
  # NOTE: google_mlkit_barcode_scanning was removed as unused — scanning is done
  # by mobile_scanner. Both plugins pull the same native pod
  # (GoogleMLKit/BarcodeScanning) with disjoint constraints (~> 9.0.0 vs
  # ~> 7.0.0), which made iOS `pod install` unresolvable.
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_translation: ^0.15.1

  # Camera & Image
  image_picker: ^1.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Storage
  shared_preferences: ^2.3.5

  # Network
  connectivity_plus: ^6.1.2

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  intl: ^0.20.2
  equatable: ^2.0.7
  dartz: ^0.10.1
  uuid: ^4.5.1

  # QR & Barcode
  mobile_scanner: ^6.0.2

  # Speech & TTS
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

  # Device Info
  package_info_plus: ^8.3.0

  # Security

  # Notifications
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.6
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  # Poppins and Inter are bundled rather than fetched at runtime.
  # google_fonts falls back to the platform default font with only a
  # print() when a fetch fails, so an offline first launch would silently
  # render in Roboto instead of the app's own typography. Bundling keeps
  # the "works offline" promise the README makes about on-device ML.
  # Weights match the ones actually used in lib/ (w400/w500/w600/w700).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
