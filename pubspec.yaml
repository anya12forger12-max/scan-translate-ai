name: scan_translate_ai
description: 'Scan & Translate AI - Premium QR/Barcode Scanner, OCR, and Translation App'
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4
  firebase_messaging: ^15.2.4

  # Authentication
  google_sign_in: ^6.3.0

  # ML Kit
  google_mlkit_barcode_scanning: ^0.16.1
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_translation: ^0.15.1

  # Camera & Image
  camera: ^0.11.1
  image_picker: ^1.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.1
  cached_network_image: ^3.4.1

  # Storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4

  # Network
  http: ^1.3.0
  connectivity_plus: ^6.1.2
  http_parser: ^4.1.2

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  intl: ^0.20.2
  equatable: ^2.0.7
  dartz: ^0.10.1
  uuid: ^4.5.1
  collection: ^1.19.1

  # QR & Barcode
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0

  # Speech & TTS
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2

  # Device Info
  device_info_plus: ^11.3.3
  package_info_plus: ^8.3.0

  # Security
  crypto: ^3.0.6

  # Notifications
  flutter_local_notifications: ^18.0.1
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.6
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
